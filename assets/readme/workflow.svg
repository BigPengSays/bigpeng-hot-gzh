<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="wtitle wdesc">
  <title id="wtitle">从输入到首选标题的工作流</title>
  <desc id="wdesc">抽出可钩元素，套 7 型公式，用履约检查卡住不能兑现的标题，最后标一个首选。</desc>
  <rect width="1200" height="280" rx="28" fill="#141210"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(36 44)">
      <rect width="252" height="192" rx="18" fill="#1E1B18" stroke="#3A342E"/>
      <text x="24" y="42" fill="#9A9388" font-size="16">01</text>
      <text x="24" y="82" fill="#F4EEE4" font-size="24" font-weight="700">抽出钩子</text>
      <text x="24" y="124" fill="#D8D0C4" font-size="18">工具 / 身份 / 数字</text>
      <text x="24" y="154" fill="#D8D0C4" font-size="18">结果 / 冲突 / 代价</text>
    </g>
    <g transform="translate(328 44)">
      <rect width="252" height="192" rx="18" fill="#1E1B18" stroke="#3A342E"/>
      <text x="24" y="42" fill="#9A9388" font-size="16">02</text>
      <text x="24" y="82" fill="#F4EEE4" font-size="24" font-weight="700">套公式</text>
      <text x="24" y="124" fill="#D8D0C4" font-size="18">6 条不同公式</text>
      <text x="24" y="154" fill="#D8D0C4" font-size="18">禁止同义改写</text>
    </g>
    <g transform="translate(620 44)">
      <rect width="252" height="192" rx="18" fill="#1E1B18" stroke="#3A342E"/>
      <text x="24" y="42" fill="#9A9388" font-size="16">03</text>
      <text x="24" y="82" fill="#F4EEE4" font-size="24" font-weight="700">履约检查</text>
      <text x="24" y="124" fill="#D8D0C4" font-size="18">数字必须可数</text>
      <text x="24" y="154" fill="#D8D0C4" font-size="18">不编造 Star</text>
    </g>
    <g transform="translate(912 44)">
      <rect width="252" height="192" rx="18" fill="#E23D2D"/>
      <text x="24" y="42" fill="#F4C4BE" font-size="16">04</text>
      <text x="24" y="82" fill="#FFFFFF" font-size="24" font-weight="700">标首选</text>
      <text x="24" y="124" fill="#FFEDE9" font-size="18">前 16 字仍成立</text>
      <text x="24" y="154" fill="#FFEDE9" font-size="18">有身份或数字</text>
    </g>
  </g>
</svg>
